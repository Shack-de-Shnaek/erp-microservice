spring.application.name=inventory
server.port=8080

axon.axonserver.enabled=false
axon.eventhandling.processors.default.mode=subscribing

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:inventory}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.register=${CONSUL_REGISTER:true}
spring.config.import=optional:consul:

# The `erp` realm, as the gateway and orders validate against it too: one issuer for the whole
# system, and each service checks a token against it rather than asking anybody who a caller is.
# The two hostnames differ on purpose - the issuer is the string a browser-minted token carries
# (KC_HOSTNAME pins it to localhost:8080), the key set is Keycloak as this container reaches it.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/erp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Only the controllers. Without this springdoc also documents whatever else happens to expose a
# request mapping - the actuator, springwolf's own endpoints - and the gateway's Swagger UI shows
# them next to the real ones.
springdoc.packages-to-scan=finki.ukim.erp.inventory.web
# Where a reader's browser reaches this service, which under docker-compose is the published port
# rather than the one inside the container. See OpenApiConfig.
erp.docs.public-url=${ERP_DOCS_PUBLIC_URL:http://localhost:8081}

springwolf.docket.base-package=finki.ukim.erp.inventory
springwolf.docket.info.title=Inventory Service API
springwolf.docket.info.version=0.0.1-SNAPSHOT
springwolf.docket.servers.kafka.host=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
springwolf.docket.servers.kafka.protocol=kafka

management.endpoints.web.exposure.include=health,info
management.health.consul.enabled=false
spring.cloud.discovery.client.health-indicator.enabled=false

spring.cloud.openfeign.circuitbreaker.enabled=true

logging.level.org.springframework.core.annotation.AnnotationTypeMapping=ERROR