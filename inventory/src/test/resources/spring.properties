# Spring Framework 7 (Spring Boot 4) pauses a cached test ApplicationContext when the suite moves
# on to a different one, stopping its SmartLifecycle beans, and restarts them if that context is
# later reused. Axon's TrackingEventProcessor does not survive that round trip: after its worker is
# stopped and reassigned it stops receiving events from the InMemoryEventStorageEngine altogether,
# so the projections in a resumed context never catch up and every read of `product_view` comes
# back empty - not late, but never.
#
# That made this suite pass or fail according to the order surefire happened to run the classes in,
# since the order decides which contexts get paused and resumed. Boot 3.2 had no such feature, so
# the problem appeared only on the upgrade.
#
# NEVER keeps every cached context running for the whole suite, which is what Boot 3.2 did. The
# cost is the memory of the handful of contexts this module builds; the benefit is a suite whose
# result does not depend on run order. Nothing in a deployment pauses a context, so this concerns
# the test framework only.
spring.test.context.cache.pause=NEVER
