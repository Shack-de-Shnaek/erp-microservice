spring.application.name=inventory-test

spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

axon.axonserver.enabled=false
axon.eventhandling.processors.default.mode=subscribing
axon.aggregate.repository=org.axonframework.modelling.command.GenericJpaRepository

spring.kafka.consumer.group-id=inventory-test-group

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.register=false
spring.autoconfigure.exclude=org.springframework.cloud.consul.config.ConsulConfigAutoConfiguration,org.springframework.cloud.consul.discovery.ConsulCatalogWatchAutoConfiguration,org.springframework.cloud.consul.serviceregistry.ConsulAutoServiceRegistrationAutoConfiguration,org.springframework.cloud.consul.serviceregistry.ConsulServiceRegistryAutoConfiguration,org.springframework.cloud.consul.support.ConsulHeartbeatAutoConfiguration

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/master/protocol/openid-connect/certs

springwolf.docket.base-package=finki.ukim.erp.inventory
springwolf.docket.info.title=Inventory Service API
springwolf.docket.info.version=0.0.1-SNAPSHOT
springwolf.docket.servers.kafka.host=kafka:29092
springwolf.docket.servers.kafka.protocol=kafka
