## The `test` profile, activated explicitly by @ActiveProfiles("test") on the tests that drive
## HTTP endpoints (the Pact provider verification and the reservation endpoint tests).
##
## It is a *profile*, not the suite's baseline: src/test/resources/application.properties already
## points every test at in-memory H2 with Consul and Axon Server switched off, and this file only
## adds what calling an endpoint without a token needs on top of that. Every other test in the
## suite keeps running under the default profile with the real SecurityConfig in place.
##
## It lives under src/test/resources rather than src/main/resources on purpose. This is
## configuration for running tests; shipping it inside the jar would put a disabled security setup
## into the production artefact, where a mistyped profile name could pick it up.
##
## The resource server autoconfiguration is excluded because it would otherwise stand up a
## JwtDecoder pointed at a Keycloak that is not running. TestSecurityConfig is the other half.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
org.springframework.cloud.consul.config.ConsulConfigAutoConfiguration,\
org.springframework.cloud.consul.discovery.ConsulCatalogWatchAutoConfiguration,\
org.springframework.cloud.consul.serviceregistry.ConsulAutoServiceRegistrationAutoConfiguration,\
org.springframework.cloud.consul.serviceregistry.ConsulServiceRegistryAutoConfiguration,\
org.springframework.cloud.consul.support.ConsulHeartbeatAutoConfiguration
