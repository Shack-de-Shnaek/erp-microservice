spring.application.name=api-gateway
spring.cloud.consul.discovery.register=true
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.config.import=optional:consul:
# Spring Cloud Consul 5 talks to the agent through Spring's RestClient, which in this WebFlux
# application is backed by reactor-netty and carries a 10-second read timeout. The config watch
# issues a *blocking* query that deliberately parks on the agent until something changes or
# `wait-time` elapses, so with the 55-second default the client always gave up first and every
# watch cycle logged `I/O error on GET .../v1/kv/config/api-gateway,default/`. Nothing was
# actually broken - the import above is `optional:` and this system keeps no configuration in
# Consul's KV store - but the gateway's log filled with failures for a call behaving as designed.
# Five seconds keeps the blocking query comfortably inside the read timeout. The servlet services
# never hit this: their RestClient is not the reactor-netty one and has no such default.
spring.cloud.consul.config.watch.wait-time=5
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Off: the public URL space is written out in RoutesConfig rather than derived from whatever is
# registered in Consul. Discovery itself stays on - the routes there address services as `lb://`.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Puts the logged-in user's access token on every proxied request as `Authorization: Bearer ...`,
# so a browser session at the gateway becomes a token the downstream services can validate. A
# request that already carries its own bearer token has no authorized client behind it and is
# forwarded untouched.
spring.cloud.gateway.server.webflux.default-filters[0]=TokenRelay=

# ---------------------------------------------------------------------------------------------
# Keycloak
#
# One realm, named the same everywhere: `erp`. The hostnames deliberately differ - the issuer and
# the authorization endpoint are what a *browser* has to reach, the token, key set and user-info
# endpoints are what this *container* has to reach. Under docker-compose those are two different
# names for the same Keycloak (localhost:8080 and keycloak:8080), which is why KC_HOSTNAME pins
# the issuer to the browser-facing one.
#
# `issuer-uri` is never dialled here, only compared against the `iss` claim: because jwk-set-uri
# and the endpoints below are all given explicitly, nothing fetches provider metadata at startup,
# so the gateway boots whether or not Keycloak is up yet.
# ---------------------------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:http://localhost:8080/realms/erp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${NIMBUS_JWK_SET_URL:http://localhost:8080/realms/erp/protocol/openid-connect/certs}

# No `issuer-uri` on the client provider, deliberately. Spring Boot treats it as an instruction to
# fetch the OIDC discovery document at *startup*, which fails the boot outright whenever Keycloak
# is not up yet, and would dial the browser-facing host from inside the container. Naming the four
# endpoints below instead skips discovery entirely. The id token is still verified against the key
# set, and against the nonce and this client's id; it is only the `iss` string that goes unchecked
# on the login leg. Bearer tokens - the ones that actually authorize the proxied requests - keep
# their issuer check, on the resource-server property above.
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URL:http://localhost:8080/realms/erp/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/erp/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${NIMBUS_JWK_SET_URL:http://localhost:8080/realms/erp/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URL:http://localhost:8080/realms/erp/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:erp-gateway}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:erp-gateway-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
# Must match a redirect URI on the erp-gateway client in keycloak/realm-erp.json.
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------------------------
# Documentation
#
# One Swagger UI for the system, at http://localhost:8088/swagger-ui.html, with both services in
# its dropdown. The documents themselves are each service's own - written by springdoc from its
# controllers - and are fetched through the /docs routes in RoutesConfig, which put them on this
# gateway's origin. That is what keeps CORS out of it.
#
# `api-docs.enabled` has to stay *on*. This gateway has no controllers of its own, so the document
# it publishes describes nothing and it used to be switched off for that reason - but in springdoc
# 3 that switch also takes down `/v3/api-docs/swagger-config`, which is the descriptor the UI
# fetches before it can render anything, and `/swagger-ui.html` then 404s. The empty document it
# costs is never opened: `urls[0]`/`urls[1]` below name the two real ones and the UI starts on the
# first of them.
# `disable-swagger-default-url` removes the petstore entry the UI otherwise ships with.
# ---------------------------------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Orders Service
springdoc.swagger-ui.urls[0].url=/docs/orders/v3/api-docs
springdoc.swagger-ui.urls[1].name=Inventory Service
springdoc.swagger-ui.urls[1].url=/docs/inventory/v3/api-docs
