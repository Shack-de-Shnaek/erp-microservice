spring:
  application:
    name: orders
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:orders}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued via Keycloak behind the api-gateway; this service only
          # validates them against Keycloak's JWK set / issuer.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/erp}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springwolf:
  docket:
    base-package: finki.ukim.erp.orders
    info:
      title: Orders Service
      version: 0.0.1
    servers:
      kafka:
        protocol: kafka
        url: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
