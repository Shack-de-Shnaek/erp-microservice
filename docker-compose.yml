services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Under a mounted volume rather than /tmp inside the container, so the log survives the
      # container being recreated as well as restarted. Postgres already persists, and a broker
      # that did not meant the two stores had different lifetimes: `docker compose down` kept every
      # order row and threw away the messages about them, or - the way round that actually bit -
      # kept a day-old backlog while the orders it referred to were gone, and replaying it asked
      # this system about orders that no longer existed.
      KAFKA_LOG_DIRS: '/var/lib/kafka/data/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    restart: on-failure
    # --import-realm reads /opt/keycloak/data/import on startup and creates the realm if it is
    # not there yet. It never overwrites an existing one, so editing realm-erp.json after the
    # first boot has no effect until the realm is deleted (or the postgres volume is dropped).
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Pins the issuer and every browser-facing URL to localhost:8080, whichever hostname the
      # request came in on. Without it Keycloak builds URLs from the request: a browser arriving
      # on localhost:8080 gets tokens issued by http://localhost:8080/realms/erp, the gateway
      # exchanging the code over the Docker network gets http://keycloak:8080/realms/erp, and the
      # id token is then rejected for an issuer mismatch.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      # ...while backchannel calls (token exchange, JWKS) still go to keycloak:8080 from inside
      # the network and are answered under that same pinned issuer.
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-erp.json:/opt/keycloak/data/import/realm-erp.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships no curl or wget, so the check talks to the realm endpoint over bash's
      # own /dev/tcp. It passes only once the realm exists, which is what the services behind it
      # actually need - a Keycloak that is listening but still importing is not ready.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/erp HTTP/1.1\\r\\nHost: localhost:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app-network

  inventory-service:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: on-failure
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # The same realm the gateway and orders validate against. Inventory is a resource server
      # too now: tokens arrive here relayed by the gateway, minted by orders' own service account,
      # or fetched by the MCP server, and all three are checked against this one issuer. The two
      # hostnames differ on purpose; see KC_HOSTNAME on the keycloak service.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/erp
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/erp/protocol/openid-connect/certs
      # Where a browser reaches this service, which is the published port and not the one the
      # container listens on. Only the "Try it out" server in its OpenAPI document uses it.
      ERP_DOCS_PUBLIC_URL: http://localhost:8081
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      consul:
        condition: service_healthy
      # Not for startup - the key set is fetched lazily, on the first token this service is asked
      # to verify, so it boots whether or not Keycloak is up. It is here so that the first request
      # after `docker compose up` is not the one that finds the realm still importing.
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  order-service:
    build:
      context: ./orders
      dockerfile: Dockerfile
    container_name: order-service
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # The same realm the gateway validates against. Tokens arrive here relayed by the gateway,
      # so a mismatch between these two is a 401 on every request that got past the front door.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/erp
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/erp/protocol/openid-connect/certs
      # This service's own credentials, for the calls to inventory that have no user behind them -
      # releasing the holds on orders whose product was just withdrawn, for instance, which is
      # driven by a Kafka event and not by anybody's request. The account behind them holds SERVICE
      # and nothing more. Token endpoint as this container reaches it, not as a browser does.
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/erp/protocol/openid-connect/token
      ORDERS_CLIENT_ID: erp-orders
      ORDERS_CLIENT_SECRET: erp-orders-secret
      # Where a browser reaches this service; only the "Try it out" server in its OpenAPI
      # document uses it.
      ERP_DOCS_PUBLIC_URL: http://localhost:8089
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      consul:
        condition: service_healthy
      # This service does dial Keycloak of its own accord - the client-credentials grant above -
      # so waiting for the realm to exist saves a first call that fails for no better reason than
      # ordering.
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: on-failure
    environment:
      # The issuer as it is written into tokens (browser-facing), and the key set as this
      # container reaches it (over the Docker network). The two hostnames differ on purpose; see
      # KC_HOSTNAME on the keycloak service.
      KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/erp
      NIMBUS_JWK_SET_URL: http://keycloak:8080/realms/erp/protocol/openid-connect/certs
      KEYCLOAK_AUTHORIZATION_URL: http://localhost:8080/realms/erp/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/erp/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URL: http://keycloak:8080/realms/erp/protocol/openid-connect/userinfo
      KEYCLOAK_CLIENT_ID: erp-gateway
      KEYCLOAK_CLIENT_SECRET: erp-gateway-secret
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    ports:
      - "8088:8080"
    depends_on:
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - app-network

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: on-failure
    environment:
      # The gateway, addressed by its service name on this network. Every tool call goes through
      # it, so the MCP server needs no route table of its own and no service's port.
      GATEWAY_URL: http://api-gateway:8080
      # Tokens are collected over the Docker network; the `iss` they are stamped with is still the
      # browser-facing localhost:8080, because KC_HOSTNAME pins it. That is what makes a token
      # fetched here acceptable to a gateway that validates against localhost:8080.
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/erp/protocol/openid-connect/token
      MCP_CLIENT_ID: erp-mcp
      MCP_CLIENT_SECRET: erp-mcp-secret
      # Set ERP_ENABLE_WRITES to false to serve only the read tools - the write ones are then not
      # registered at all, so a model on the other end cannot see or call them.
      ERP_ENABLE_WRITES: "true"
    ports:
      - "8765:8765"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
