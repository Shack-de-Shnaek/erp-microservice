# The infrastructure every service in the system shares: the broker they publish to, the registry
# they find each other through, and the authorization server that issues the tokens they all
# validate.
#
# Each service also has its own compose.yaml for the things only it needs (its Postgres, its own
# container); this one holds the pieces they have in common, so it comes up once and stays up
# regardless of which services are running.
#
#   docker compose up -d
#   docker ps
#
# Single-node KRaft: no ZooKeeper, and one broker acting as its own controller. Fine for
# development, and the reason every replication factor below is 1.
services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      # Only the host listener is published. Containers on erp_shared reach the broker on
      # broker:29092; anything running on the developer's machine uses localhost:9092.
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      erp_shared:
        aliases:
          - "kafka"
          - "broker"

  # The service registry. Orders registers itself here and resolves `inventory` through it, so
  # neither service has to be told the other's address.
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      # 8500 is both the HTTP API the services use and the UI, at http://localhost:8500.
      - 8500:8500
    command: agent -dev -client=0.0.0.0 -ui
    networks:
      erp_shared:
        aliases:
          - "consul"

  # Issues the tokens every service in the system validates. Started with the `erp` realm already
  # imported, so a fresh `docker compose up` has the roles and users the services expect rather
  # than an empty realm someone has to configure by hand.
  #
  #   staff/staff       -> ADMIN
  #   customer/customer -> CLIENT
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The issuer in a token has to be byte-identical to what the resource servers expect, and
      # they are configured with localhost:8080 - so Keycloak must call itself that too.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-erp.json:/opt/keycloak/data/import/realm-erp.json:ro
    ports:
      - 8080:8080
    networks:
      erp_shared:
        aliases:
          - "keycloak"

networks:
  erp_shared:
    driver: bridge
    name: erp_shared
