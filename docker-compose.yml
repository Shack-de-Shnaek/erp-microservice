services:
  consul:
    image: consul:1.15.2
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0 -log-level=warn"
    networks:
      - shared_net

  broker:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'WARN'
      KAFKA_LOG4J_LOGGERS: 'kafka.server=WARN,kafka.controller=WARN,kafka.network=WARN,org.apache.kafka=WARN'
    networks:
      - shared_net

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5439:5432"
    volumes:
      - ./docker-db/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8082:8080"
    command: start-dev
    depends_on:
      - postgres
    networks:
      - shared_net
    volumes:
      - ./keycloak/import:/opt/keycloak/config/import:ro

  inventory-app:
    build:
      context: ./inventory
    container_name: inventory-app
    environment:
      SPRING_APPLICATION_NAME: inventory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      CONSUL_REGISTER: "true"
      SPRING_CLOUD_CONSUL_TOKEN_HEADER_ENABLED: "true"
    ports:
      - "8088:8080"
    depends_on:
      - consul
      - broker
      - postgres
    networks:
      - shared_net

  orders-app:
    build:
      context: ./orders
    container_name: orders-app
    environment:
      SPRING_APPLICATION_NAME: orders
      SPRING_CONFIG_IMPORT: optional:consul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_TOKEN_HEADER_ENABLED: "true"
    ports:
      - "8089:8080"
    depends_on:
      - consul
      - broker
      - postgres
    networks:
      - shared_net

  api_gateway:
    build:
      context: ./api-gateway
    container_name: api_gateway
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_TOKEN_HEADER_ENABLED: "true"
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/finki-services
      NIMBUS_JWK_SET_URL: http://keycloak:8080/realms/finki-services/protocol/openid-connect/keys
    ports:
      - "8087:8080"
    depends_on:
      - consul
      - broker
      - keycloak
      - postgres
    networks:
      - shared_net

networks:
  shared_net:
    driver: bridge

volumes:
  postgres_data:
